apiVersion: v1
kind: Pod
metadata:
  name: nfs-test-node1
spec:
  nodeName: kubecl-worker-01
  containers:
    - name: test
      image: busybox
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: nfs
          mountPath: /data
  volumes:
    - name: nfs
      persistentVolumeClaim:
        claimName: test-nfs-rust

