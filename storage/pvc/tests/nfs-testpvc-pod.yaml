apiVersion: v1
kind: Pod
metadata:
  name: nfs-test
spec:
  containers:
    - name: test
      image: busybox
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: nfs
          mountPath: /data
  volumes:
    - name: nfs
      persistentVolumeClaim:
        claimName: test-nfs
